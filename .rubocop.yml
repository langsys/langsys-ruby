AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Metrics/MethodLength:
  Max: 40

Metrics/AbcSize:
  Max: 40

Metrics/ClassLength:
  # Raised from 250 by the 838 wave: Client is the composition root and now also owns the
  # GATE-1/GATE-8 write-decision resolution and the CID-3 legacy-lookup guard. Splitting
  # it to satisfy a line count would scatter one rule family across several files, each
  # holding a branch of a decision that has to be read as a whole.
  Max: 300

Metrics/ModuleLength:
  Max: 150

Metrics/ParameterLists:
  CountKeywordArgs: false

# Some methods (refresh, close) return a boolean for parity with the other SDKs without
# being predicates.
Naming/PredicateMethod:
  Enabled: false

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"

Layout/LineLength:
  Max: 120

Naming/PredicatePrefix:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

# The ICU parser uses conventional single-letter names (i = index, ch = char, n = length).
Naming/MethodParameterName:
  MinNameLength: 1
  AllowedNames:
    - i
    - n
    - ch
